configuration:
  telegram_token:
    name: Telegram token
    description: Telegram bot token from BotFather
  openai_api_key:
    name: OpenAI API key
    description: OpenAI API key for the assistant
  openai_model:
    name: OpenAI model
    description: Model name, for example gpt-5-mini
  todoist_api_token:
    name: Todoist API token
    description: Todoist API token for reading and updating tasks
  telegram_chat_id:
    name: Telegram chat ID
    description: Optional chat ID for daily messages. Leave empty and use /register.
  morning_time:
    name: Morning briefing time
    description: Daily briefing time in HH:MM format
  evening_time:
    name: Evening review time
    description: Daily review time in HH:MM format
  timezone:
    name: Timezone
    description: Timezone for scheduled messages, for example Europe/Berlin
  planning_nudge_times:
    name: Planning nudge times
    description: Comma-separated times for short daily planning nudges, for example 12:30,17:30
  workday_start:
    name: Workday start
    description: Earliest time for calendar-aware planning options in HH:MM format
  workday_end:
    name: Workday end
    description: Latest time for calendar-aware planning options in HH:MM format
  default_task_duration:
    name: Default task duration
    description: Duration in minutes when a Todoist task has no duration
  google_calendar_enabled:
    name: Enable Google Calendar
    description: Uses Google Free/Busy for calendar-aware planning options when a token is available
  google_calendar_write_enabled:
    name: Write Google Calendar
    description: Allows creating calendar events; disabled by default
  google_calendar_id:
    name: Google Calendar ID
    description: Calendar ID for Free/Busy and optional events, usually primary
  google_token_file:
    name: Google token file
    description: Path to the JSON file with a Google OAuth access_token
