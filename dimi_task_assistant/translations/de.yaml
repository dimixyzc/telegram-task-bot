configuration:
  telegram_token:
    name: Telegram-Token
    description: Telegram-Bot-Token von BotFather
  openai_api_key:
    name: OpenAI-API-Key
    description: OpenAI-API-Key fuer den Assistenten
  openai_model:
    name: OpenAI-Modell
    description: Modellname, zum Beispiel gpt-5-mini
  todoist_api_token:
    name: Todoist-API-Token
    description: Todoist-API-Token zum Lesen und Aktualisieren von Aufgaben
  telegram_chat_id:
    name: Telegram-Chat-ID
    description: Optionale Chat-ID fuer taegliche Nachrichten. Leer lassen und /register nutzen.
  morning_time:
    name: Morgen-Briefing-Zeit
    description: Taegliche Briefing-Zeit im Format HH:MM
  evening_time:
    name: Abend-Review-Zeit
    description: Taegliche Review-Zeit im Format HH:MM
  timezone:
    name: Zeitzone
    description: Zeitzone fuer geplante Nachrichten, zum Beispiel Europe/Berlin
  planning_nudge_times:
    name: Planungs-Erinnerungen
    description: Kommagetrennte Zeiten fuer kurze Tagesplan-Erinnerungen, zum Beispiel 12:30,17:30
  workday_start:
    name: Arbeitstag-Start
    description: Frueheste Uhrzeit fuer kalendergestuetzte Planungsoptionen im Format HH:MM
  workday_end:
    name: Arbeitstag-Ende
    description: Spaeteste Uhrzeit fuer kalendergestuetzte Planungsoptionen im Format HH:MM
  default_task_duration:
    name: Standard-Aufgabendauer
    description: Dauer in Minuten, wenn eine Todoist-Aufgabe keine Dauer hat
  google_calendar_enabled:
    name: Google Calendar aktivieren
    description: Nutzt Google Free/Busy fuer kalendergestuetzte Planungsoptionen, wenn ein Token vorhanden ist
  google_calendar_write_enabled:
    name: Google Calendar schreiben
    description: Erlaubt das Erstellen von Kalender-Events; standardmaessig deaktiviert
  google_calendar_id:
    name: Google Calendar-ID
    description: Kalender-ID fuer Free/Busy und optionale Events, meist primary
  google_token_file:
    name: Google-Token-Datei
    description: Pfad zur JSON-Datei mit Google OAuth access_token
